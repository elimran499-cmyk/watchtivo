<!doctype html>
<html lang="nl">
  <head>
    <!-- Google tag (gtag.js).
         The stub runs inline and immediately: it defines gtag() and queues every
         call into dataLayer, so conversions fired before the remote tag lands are
         kept and replayed. That lets the 100 KB gtag.js itself wait — as the very
         first element in <head> the preload scanner would fetch it ahead of the
         fonts and the app bundle, spending the opening round-trips of the visit on
         a script that paints nothing. It is pulled in on whichever comes first:
         window load, or the first sign of a user who might convert. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-18345460239');

      (function () {
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18345460239';
          document.head.appendChild(s);
        }
        var events = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
        events.forEach(function (e) {
          window.addEventListener(e, loadGtag, {once: true, passive: true, capture: true});
        });
        if (document.readyState === 'complete') loadGtag();
        else window.addEventListener('load', loadGtag, {once: true});
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IPTV kopen en krijg toegang tot meer dan 35.000 tv-zenders en 150.000 films en series. Beschikbaar vanaf slechts €25 voor 3 maanden. Vraag nu je gratis proefpakket aan!"
    />
    <title>IPTV Kopen? Probeer een gratis IPTV abonnement in Nederland</title>
    <!-- Geo-IP lookup that picks the language on a first visit. -->
    <link rel="preconnect" href="https://get.geojs.io" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
